# ZMK Studio (問題があれば y を n に変更して無効化)
CONFIG_ZMK_STUDIO=y
# Debug: Verify Firmware Update
CONFIG_ZMK_KEYBOARD_NAME="Torabo Check"
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 2M PHYを無効化し、より遠くまで届き途切れにくい1M PHYで接続する(距離/安定性の改善)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# ホストのプロファイル数は自動計算される: BT_MAX_PAIRED - ペリフェラル数
# 4 - 1(左手) = 3プロファイル(Mac/Win/Win)。#99でMac接続できていた設定。
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900
CONFIG_ZMK_POINTING=y
# 一時的なBLE遅延で古い移動レポートを溜め込みすぎないようにする。
# 15ms周期なら最大約60ms分に抑え、切替後の慣性感を減らす。
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=4

# BLE HIDでAppleが許容する11.25msから15msを要求する。
# 従来の15msから30msではMac側が30msを選ぶとカーソル更新が粗くなる。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 左手側への再接続改善 (セントラル用)
CONFIG_PM=n
CONFIG_ZMK_IDLE_TIMEOUT=0
CONFIG_ZMK_SLEEP=n

# Split BLE接続タイムアウト延長 (左側聴っている時間を延ばす)
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600
